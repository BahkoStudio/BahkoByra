<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8">
<title>Maskotfilm overlay v38</title>
<!-- Renderas lokalt i Edge (Google Fonts nås). ?f=1|2&i=0..5 textbeats, ?wm=1 loggan, ?bg=1 outro-bakgrund. -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
body{font-family:'Outfit',sans-serif;position:relative}
.blob{position:absolute;left:60px;right:60px;bottom:290px;background:rgba(10,22,40,.80);border-radius:28px;padding:42px 46px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.kick{font-weight:800;font-size:34px;letter-spacing:.16em;color:#34D399;text-transform:uppercase;margin-bottom:18px}
.t{font-weight:800;font-size:76px;line-height:1.12;color:#FFF}
.t em{font-style:normal;color:#34D399}
.t span{display:block;white-space:nowrap}
.blob.punch{text-align:center;padding:60px 46px}
.blob.punch .t{font-size:150px;line-height:1}
.wm{position:absolute;top:64px;left:60px}
.wm img{height:74px;display:block;filter:drop-shadow(0 4px 18px rgba(0,0,0,.65))}
.bg{position:absolute;inset:0;background:#0A1628;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:52px}
.bg .vem{color:#FFF;font-weight:800;font-size:44px;text-align:center;max-width:900px;line-height:1.25}
.bg .vem em{font-style:normal;color:#34D399}
.bg img.m{width:520px;height:auto;filter:drop-shadow(0 30px 60px rgba(0,0,0,.5))}
.btn{background:#10B981;color:#0A1628;font-weight:800;font-size:96px;letter-spacing:.02em;padding:36px 84px;border-radius:40px;box-shadow:0 20px 60px rgba(16,185,129,.35)}
.sub{color:#94A7BF;font-weight:700;font-size:38px;text-align:center;max-width:860px;line-height:1.3}
.bg .logo{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);height:74px}
</style></head><body>
<script>
const LOGO='file:///C:/Users/mathi/OneDrive/Skrivbord/bahko-loop-wt/web/public/brand/logo-dark.svg';
const MASKOT='file:///C:/Users/mathi/.claude/skills/ig-karusell/references/maskot/bahko-master.png';
const F={
 1:[
  {k:'22.41',        t:'Klockan 22.41 svarar<br>ingen i <em>telefon</em>.'},
  {k:'Men',          t:'Kunden vill<br>boka <em>nu</em>.'},
  {k:'Hemsidan',     t:'Tre fält.<br><em>Tjugo sekunder.</em>'},
  {k:'',             t:'<em>Skickat.</em>', punch:true},
  {k:'På morgonen',  t:'Jobbet ligger<br>i <em>inkorgen</em>.'},
  {k:'Så enkelt',    t:'En hemsida som jobbar<br>när du <em>sover</em>.'}
 ],
 2:[
  {k:'Testet',       t:'Jag testade tio hemsidor<br>från <em>soffan</em>.'},
  {k:'Som kunden',   t:'En minut var.<br>Som en <em>kund</em> gör.'},
  {k:'Resultatet',   t:'Nio fält. Kod att skriva av.<br>Numret i en <em>bild</em>.'},
  {k:'',             t:'<em>En minut.</em>', punch:true},
  {k:'Sen',          t:'Sen går hon vidare<br>till <em>nästa firma</em>.'},
  {k:'Lösningen',    t:'Tre fält. Tjugo sekunder.<br>Så klarar du <em>minuten</em>.'}
 ]
};
const q=new URLSearchParams(location.search);
if(q.get('wm')==='1'){
  document.write('<div class="wm"><img src="'+LOGO+'" alt="Bahko Byrå"></div>');
}else if(q.get('bg')==='1'){
  document.write('<div class="bg"><div class="vem">Jag bygger hemsidor åt lokala företag<br>så att <em>fler kunder ringer</em>.</div><img class="m" src="'+MASKOT+'" alt=""><div class="btn">DM:a DEMO</div><div class="sub">så bygger jag ett förslag på er nya hemsida. Kostar inget. Klart på två dygn.</div><img class="logo" src="'+LOGO+'" alt=""></div>');
}else{
  const f=parseInt(q.get('f')||'1',10), i=parseInt(q.get('i')||'0',10), b=F[f][i];
  const rows=b.t.split('<br>').map(r=>'<span>'+r+'</span>').join('');
  document.write('<div class="blob'+(b.punch?' punch':'')+'">'+(b.k?'<div class="kick">'+b.k+'</div>':'')+'<div class="t" id="t">'+rows+'</div></div>');
  const t=document.getElementById('t'); const sp=[...t.querySelectorAll('span')];
  let px=b.punch?150:76; t.style.fontSize=px+'px';
  while(px>48 && sp.some(r=>r.scrollWidth>t.clientWidth)){px-=2;t.style.fontSize=px+'px';}
}
</script>
</body></html>
