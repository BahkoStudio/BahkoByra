<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8"><title>Bildkort</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0A1628}
body{font-family:'Outfit',sans-serif;position:relative;color:#fff}
.kick{position:absolute;left:90px;top:120px;font-weight:800;font-size:30px;letter-spacing:.18em;color:#34D399;text-transform:uppercase}
.t{position:absolute;left:90px;right:90px;top:50%;transform:translateY(-52%);font-weight:800;font-size:112px;line-height:1.08}
.t em{font-style:normal;color:#34D399}
.logo{position:absolute;right:90px;bottom:100px;height:78px}
.rule{position:absolute;left:90px;bottom:120px;width:120px;height:8px;background:#10B981;border-radius:4px}
</style></head><body>
<div class="kick">Sanningen</div>
<div class="t">Ingen ringer<br>ett nummer<br>de var tvungna<br>att <em>leta</em> efter.</div>
<div class="rule"></div>
<img class="logo" src="../../../../../web/public/brand/logo-dark.svg" alt="Bahko Byrå">
</body></html>
