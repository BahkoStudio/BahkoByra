    <div class="panel">
      <div class="ph"><h3>Demo</h3></div>
      <div class="hbar"><span style="font-size:.75rem;color:var(--p70);flex:1">Beslut, historik och prisändringar sparas i webbläsaren.</span>
        <button class="ghost" id="reset">Nollställ demodata</button></div>
    </div>
  </div>
  <div class="col">${panelInsikter()}${panelLogg()}</div>`;
}

/* --- historik --- */
function vyHistorik() {
  const h = [...state.historik].sort((a, b) => b.ts - a.ts);
  const tillampade = h.filter(x => x.beslut === 'Godkänd');
  return `<div class="col">
    <div class="panel">
      <div class="ph"><h3>Full historik</h3><span class="tag">${h.length} poster</span>
        <div class="rt"><span class="sub">${tillampade.length} tillämpade ändringar</span></div></div>
      ${h.length ? `<div class="tw"><table>
        <thead><tr><th>Datum</th><th>Tjänst</th><th class="r">Från</th><th class="r">Till</th><th class="r">Ändring</th>
          <th class="c">Säkerhet</th><th>Motivering</th><th>Beslut</th></tr></thead>
        <tbody>${h.map(x => `<tr data-id="${x.tjanstId}">
          <td class="mono" style="white-space:nowrap">${x.ts.toLocaleDateString('sv-SE', { day:'numeric', month:'short', year:'numeric' })}
            <span style="display:block;font-size:.62rem;color:var(--p28)">${x.av}</span></td>
          <td>${x.tjanst}</td>
          <td class="r mono">${kr(x.fran)}</td>
          <td class="r mono">${kr(x.till)}</td>
          <td class="r"><span class="${x.till > x.fran ? 'up' : x.till < x.fran ? 'down' : 'flat'}">
            ${x.till === x.fran ? '— 0 %' : (x.till > x.fran ? '↑ ' : '↓ ') + num(Math.abs((x.till - x.fran) / x.fran * 100), 1) + ' %'}</span></td>
          <td class="c">${ring(x.conf)}</td>
          <td style="max-width:320px;color:var(--p70);font-size:.73rem">${x.orsak}</td>
          <td><span class="st ${x.beslut === 'Godkänd' ? 'st-ok' : x.beslut === 'Avslagen' ? 'st-no' : 'st-w'}">${x.beslut}</span></td>
        </tr>`).join('')}</tbody></table></div>`
        : `<div class="empty">Ingen historik ännu.</div>`}
    </div>
  </div>
  <div class="col">${panelLogg()}${panelKat()}</div>`;
}

/* ---------- 11b. reel-läge (?reel) ----------
   Samma motor, samma data, men renderad i en fast 9:16-scen på 540x960 som
   skalas till skärmen. Ett fast utsnitt att spela in, ingen pan och ingen zoom. */
state.reel = /(^|[?&])reel(&|=|$)/.test(location.search) || location.hash === '#reel';
if (state.reel) document.documentElement.classList.add('reel');

const REEL_INS = {
  kapacitetsbrist:{ rub:'Full kalender, utrymme uppåt', col:'var(--ok)', bg:'var(--ok-bg)',
    ico:'<path d="M12 19V5M5 12l7-7 7 7"/>',
    txt:n => `${n} tjänster har stark efterfrågan och nästan inga lediga veckor kvar.` },
  prisfriktion:{ rub:'Intresset fastnar vid priset', col:'var(--dgr)', bg:'var(--dgr-bg)',
    ico:'<path d="M12 5v14M5 12l7 7 7-7"/>',
    txt:n => `${n} tjänster drar många förfrågningar men tappar dem sent, med avhopp över snittet.` },
  presentation:{ rub:'Presentationsproblem, inte pris', col:'var(--warn)', bg:'var(--warn-bg)',
    ico:'<circle cx="12" cy="12" r="9"/><path d="M12 9v4M12 17h.01"/>',
    txt:n => `${n} tjänster får trafik men nästan inga påbörjade förfrågningar. Priset lämnas orört.` },
  overkapacitet:{ rub:'Hål i kalendern', col:'var(--info)', bg:'rgba(3,105,161,.12)',
    ico:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4"/>',
    txt:n => `${n} tjänster har lediga veckor och fallande säljtempo.` },
  'lite-data':{ rub:'För tunt underlag', col:'var(--p45)', bg:'var(--navy-4)',
    ico:'<path d="M4 19h16M7 16v-5M12 16V7M17 16v-8"/>',
    txt:n => `${n} tjänster har för lite trafik för att prissättas av motorn.` }
};

function reelKort(r) {
  const { t, m, rek } = r;
  const [dTxt, dCls] = efterfraganText(r.demand);
  const [, kCls] = kapacitetText(m.ledigAndel);
  const A = { hoj:['a-up', 'Höj'], sank:['a-dn', 'Sänk'], oforandrat:['a-nc', 'Oförändrat'] }[rek.typ];
  let badge = `<span class="act ${A[0]}">${A[1]}</span>`;
  if (rek.laast) badge = `<span class="act a-lk">Kylperiod</span>`;
  else if (rek.beslut) badge = `<span class="act ${rek.beslut.status === 'godkand' ? 'a-up' : 'a-nc'}">${rek.beslut.status === 'godkand' ? 'Godkänd' : 'Avslagen'}</span>`;

  return `<div class="r-card ${state.valdId === t.id ? 'hl' : ''}" data-open="${t.id}">
    <div class="r-c1">${svgIco(t.kat)}
      <div><b>${t.namn}</b><span>${t.ref}</span></div>
      <span class="r-act">${badge}
        ${rek.typ !== 'oforandrat' ? `<em style="display:block;font-size:11px;margin-top:4px;font-style:normal"
          class="${rek.deltaPct > 0 ? 'up' : 'down'}">${rek.deltaPct > 0 ? '↑' : '↓'} ${num(Math.abs(rek.deltaPct), 1)} %</em>` : ''}</span>
    </div>
    <div class="r-c2">
      <div><span>Efterfrågan</span><b>${r.demand}<i class="${dCls}"> ${dTxt}</i></b></div>
      <div><span>Ledig kapacitet</span><b class="${kCls}">${t.ledig} v<i style="color:var(--p28)"> av 8</i></b></div>
      <div><span>Offertkonv.</span><b>${pct(m.konv, 0)}</b></div>
    </div>
    <div class="r-c3">
      ${rek.typ === 'oforandrat'
        ? `<span class="p0">${kr(t.pris)}</span>`
        : `<span class="p1">${kr(t.pris)}</span><span class="arw">→</span><span class="p2">${kr(rek.nyttPris)}</span>`}
      <span class="rr">${ring(rek.conf)}<em>säker&shy;het</em></span>
    </div>
  </div>`;
}

function vyReel() {
  const v = synliga();
  const agg = k => v.reduce((a, r) => ({ oms:a.oms + r.m[k].vunna * r.t.pris, vunna:a.vunna + r.m[k].vunna,
    skickade:a.skickade + r.m[k].skickade }), { oms:0, vunna:0, skickade:0 });
  const nu = agg('nu'), fr = agg('forra');
  const kpi = [
    ['Bokad omsättning', kr(nu.oms), fr.oms ? nu.oms / fr.oms - 1 : 0],
    ['Vunna jobb', nfk.format(nu.vunna), fr.vunna ? nu.vunna / fr.vunna - 1 : 0],
    ['Offertkonvertering', pct(nu.skickade ? nu.vunna / nu.skickade : 0),
      (fr.skickade && nu.skickade) ? (nu.vunna / nu.skickade) / (fr.vunna / fr.skickade) - 1 : 0],
    ['Väntar på dig', vantande().length + ' st', null]
  ];
  const grupper = Object.keys(REEL_INS)
    .map(d => ({ d, n: v.filter(r => r.rek.diagnos === d).length }))
    .filter(x => x.n).slice(0, 2);

  return `<div class="stage" id="stage">
    <div class="r-top">
      <div class="mark"><img src="/brand/mark.svg" alt=""></div>
      <h1>Pris<em>Motor</em><span>Dynamisk prissättning</span></h1>
      <span class="r-per">${state.period} dagar</span>
    </div>
    <div class="r-scroll" id="rscroll">
      <div class="r-kpis">${kpi.map(([l, val, d]) => `
        <div class="r-kpi"><span>${l}</span><b>${val}</b>
          <u>${d === null ? '<span class="flat">av ' + v.length + ' tjänster</span>' : delta(d)}</u></div>`).join('')}
      </div>
      ${grupper.map(g => { const I = REEL_INS[g.d]; return `<div class="r-ins">
        <span class="i-i" style="background:${I.bg};color:${I.col}"><svg viewBox="0 0 24 24">${I.ico}</svg></span>
        <div><b>${I.rub}</b><p>${I.txt(g.n)}</p></div></div>`; }).join('')}
      <div class="r-lbl">Rekommendationer <i>${v.length} tjänster</i></div>
      ${v.map(reelKort).join('')}
    </div>
    <div class="r-bot">
      <button class="run" data-run="1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
        Kör prisanalys
      </button>
      <button class="sw ${state.auto ? 'on' : ''}" data-auto="1" aria-label="Autoläge"></button>
      <small>Auto ${state.auto ? 'på' : 'av'}</small>
    </div>
    <div class="r-ov" id="rov"></div>
  </div>`;
}

function skalaScen() {
  const st = document.getElementById('stage'); if (!st) return;
  st.style.transform = `scale(${Math.min(innerWidth / 540, innerHeight / 960)})`;
}
window.addEventListener('resize', skalaScen);

function renderReel() {
  const body = document.getElementById('body');
  /* koppla loss toast-lådan först, annars raderas en toast som just poppade
     när scenen ritas om (den ligger inuti scenen för att komma med i bild) */
  let tw = document.getElementById('toasts');
  if (tw) tw.remove();
  body.innerHTML = vyReel();
  if (!tw) { tw = document.createElement('div'); tw.id = 'toasts'; tw.className = 'toasts'; }
  document.getElementById('stage').appendChild(tw);
  skalaScen();
}

function openReelKort(id) {
  const r = RAD.find(x => x.t.id === id); if (!r) return;
  state.valdId = id;
  const { t, m, rek } = r;
  const A = { hoj:['a-up', 'Höj priset'], sank:['a-dn', 'Sänk priset'], oforandrat:['a-nc', 'Lämna orört'] }[rek.typ];
  const gr = [
    { ok: rek.kylKvar === 0, txt: rek.kylKvar === 0
      ? `Kylperiod klar, senaste ändring för ${t.andrad} dagar sedan.`
      : `Kylperiod aktiv, ${rek.kylKvar} dagar kvar.` },
    { ok: rek.nyttPris >= t.min && rek.nyttPris <= t.max,
      txt: `Inom spannet ${kr(t.min)} till ${kr(t.max)}.${rek.kapadAv.length ? ' Kapad av ' + rek.kapadAv.join(' och ') + '.' : ''}` },
    { ok: !rek.kraverGodk, txt: rek.kraverGodk
      ? `${num(Math.abs(rek.deltaPct), 1)} % kräver ditt godkännande.`
      : `Under tröskeln ${state.regler.godkTroskel} %.` }
  ];
  let fot;
  if (rek.typ === 'oforandrat') fot = `<span class="done">Inget beslut behövs.</span>`;
  else if (rek.laast) fot = `<span class="locked">Låst i ${rek.kylKvar} dagar</span>`;
  else if (rek.beslut) fot = `<span class="done">${rek.beslut.status === 'godkand' ? 'Godkänd' : 'Avslagen'}</span>`;
  else fot = `<button class="rj" data-rej="${t.id}">Avslå</button>
              <button class="ap" data-app="${t.id}">Godkänn ${kr(rek.nyttPris)}</button>`;

  document.getElementById('rov').innerHTML = `
    <div class="r-oh">${svgIco(t.kat)}
      <div><h3>${t.namn}</h3><span>${t.ref} · ${KATNAMN[t.kat]}</span></div>
      <button class="x" data-close="1" aria-label="Stäng">✕</button>
    </div>
    <div class="r-oc">
      <div class="dsec"><h5>Förslag</h5>
        <div class="price">
          <div class="pb"><span>Riktpris nu</span><b>${kr(t.pris)}</b></div>
          <span class="arw">→</span>
          <div class="pb" style="border-color:var(--line-2)"><span>Rekommenderat</span><b>${kr(rek.nyttPris)}</b></div>
        </div>
        <div style="display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;align-items:center">
          <span class="act ${A[0]}">${A[1]}</span>
          ${rek.typ !== 'oforandrat' ? `<span class="st ${rek.deltaPct > 0 ? 'st-ok' : 'st-no'}">${rek.deltaPct > 0 ? '+' : ''}${num(rek.deltaPct, 1)} %</span>` : ''}
          <span class="st st-w">Säkerhet ${Math.round(rek.conf * 100)} %</span>
        </div>
        ${rek.flagga ? `<p style="margin-top:10px;font-size:11.5px;color:var(--warn)">⚑ ${rek.flagga}</p>` : ''}
      </div>
      <div class="ai">
        <div class="aih"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg> Så tolkar motorn läget</div>
        ${r.text.map(p => `<p>${p}</p>`).join('')}
        <div class="fine">Genererad utifrån de fem signalerna nedan. Ingen signal avgör ensam.</div>
      </div>
      <div class="dsec"><h5>Signalstöd</h5>
        <div class="sig">${r.sig.map(s => {
          const w = Math.abs(s.v) * 50, col = s.v >= 0 ? 'var(--ok)' : 'var(--dgr)';
          return `<div class="sg"><span class="sn">${s.namn}</span>
            <span class="sb"><i style="background:${col};${s.v >= 0 ? 'left:50%' : 'right:50%'};width:${w}%"></i></span>
            <span class="sv" style="color:${col}">${s.v >= 0 ? '+' : ''}${num(s.v, 2)}</span>
            <span class="sw2">${s.text}</span></div>`;
        }).join('')}</div>
      </div>
      <div class="dsec"><h5>Beteende ${m.n} dagar</h5>
        <div class="kv">
          <span class="k">Visningar</span><span class="v">${nfk.format(m.nu.visningar)}</span>
          <span class="k">Påbörjade förfrågningar</span><span class="v">${m.nu.paborjade}</span>
          <span class="k">Avbrutna</span><span class="v">${m.nu.avbrutna} (${pct(m.avhopp, 0)})</span>
          <span class="k">Skickade offerter</span><span class="v">${m.nu.skickade}</span>
          <span class="k">Vunna jobb</span><span class="v">${m.nu.vunna}</span>
          <span class="k">Säljtempo</span><span class="v">${num(m.velNu, 1)} jobb/v</span>
          <span class="k">Ledig kapacitet</span><span class="v">${t.ledig} av 8 veckor</span>
        </div>
      </div>
      <div class="dsec"><h5>Spärrar</h5>
        <div class="gr">${gr.map(x => `<div class="${x.ok ? 'pass' : 'block'}">
          <svg viewBox="0 0 24 24">${x.ok ? '<path d="M4 12l5 5L20 6"/>' : '<path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/>'}</svg>
          <span>${x.txt}</span></div>`).join('')}</div>
      </div>
    </div>
    <div class="r-of">${fot}</div>`;
  document.getElementById('rov').classList.add('on');
  document.querySelectorAll('.r-card').forEach(c => c.classList.toggle('hl', c.dataset.open === id));
}

/* ---------- 12. drawer ---------- */
function openDrawer(id) {
  if (state.reel) return openReelKort(id);
  const r = RAD.find(x => x.t.id === id); if (!r) return;
  state.valdId = id;
  const { t, m, rek } = r;
  const hist = state.historik.filter(h => h.tjanstId === id).sort((a, b) => b.ts - a.ts);
  const A = { hoj:['a-up', 'Höj priset'], sank:['a-dn', 'Sänk priset'], oforandrat:['a-nc', 'Lämna orört'] }[rek.typ];

  const gr = [
    { ok: rek.kylKvar === 0, txt: rek.kylKvar === 0
      ? `Kylperiod klar: senaste ändring för ${t.andrad} dagar sedan (gräns ${state.regler.kylperiod}).`
      : `Kylperiod aktiv: ${rek.kylKvar} dagar kvar innan priset får röras igen.` },
    { ok: rek.nyttPris >= t.min && rek.nyttPris <= t.max,
      txt: `Inom prisspannet ${kr(t.min)} – ${kr(t.max)}.${rek.kapadAv.length ? ' Kapad av ' + rek.kapadAv.join(' och ') + '.' : ''}` },
    { ok: !rek.kraverGodk, txt: rek.kraverGodk
      ? `Ändringen är ${num(Math.abs(rek.deltaPct), 1)} % och kräver manuellt godkännande (tröskel ${state.regler.godkTroskel} %).`
      : `Under godkännandetröskeln ${state.regler.godkTroskel} %${state.auto ? ', autoläge får tillämpa den' : ''}.` },
    { ok: m.nu.visningar >= state.regler.minVisningar * (state.period / 7),
      txt: `Underlag: ${m.nu.visningar} visningar och ${m.nu.skickade} skickade offerter på ${m.n} dagar.` }
  ];

  let fot;
  if (rek.typ === 'oforandrat') fot = `<span class="done">Inget beslut behövs${rek.flagga ? ' på priset' : ''}.</span>`;
  else if (rek.laast) fot = `<span class="locked">Låst i ${rek.kylKvar} dagar av kylperioden</span>`;
  else if (rek.beslut) fot = `<span class="done">${rek.beslut.status === 'godkand' ? 'Godkänd' : 'Avslagen'} ${tidText(new Date(rek.beslut.ts))}</span>`;
  else fot = `<button class="rj" data-rej="${t.id}">Avslå</button>
              <button class="ap" data-app="${t.id}">${rek.kraverGodk ? 'Godkänn ändring' : 'Tillämpa'} (${kr(rek.nyttPris)})</button>`;

  document.getElementById('drawer').innerHTML = `
    <div class="dh">
      ${svgIco(t.kat)}
      <div><h3>${t.namn}</h3><span>${t.ref} · ${KATNAMN[t.kat]}</span></div>
      <button class="x" id="dx" aria-label="Stäng">✕</button>
    </div>
    <div class="dc">
      <div class="dsec">
        <h5>Förslag</h5>
        <div class="price">
          <div class="pb"><span>Riktpris nu</span><b>${kr(t.pris)}</b></div>
          <span class="arw">→</span>
          <div class="pb" style="border-color:var(--line-2)"><span>Rekommenderat</span><b>${kr(rek.nyttPris)}</b></div>
        </div>
        <div style="display:flex;gap:.5rem;margin-top:.7rem;flex-wrap:wrap;align-items:center">
          <span class="act ${A[0]}">${A[1]}</span>
          ${rek.typ !== 'oforandrat' ? `<span class="st ${rek.deltaPct > 0 ? 'st-ok' : 'st-no'}">${rek.deltaPct > 0 ? '+' : ''}${num(rek.deltaPct, 1)} %</span>` : ''}
          <span class="st st-w">Säkerhet ${Math.round(rek.conf * 100)} %</span>
          <span style="font-size:.68rem;color:var(--p28)">Poäng ${rek.score > 0 ? '+' : ''}${rek.score}</span>
        </div>
        ${rek.flagga ? `<p style="margin-top:.7rem;font-size:.73rem;color:var(--warn)">⚑ ${rek.flagga}</p>` : ''}
      </div>

      <div class="ai">
        <div class="aih"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg> Så tolkar motorn läget</div>
        ${r.text.map(p => `<p>${p}</p>`).join('')}
        <div class="fine">Genererad förklaring utifrån de fem signalerna nedan. Ingen signal avgör ensam.</div>
      </div>

      <div class="dsec">
        <h5>Signalstöd</h5>
        <div class="sig">${r.sig.map(s => {
          const w = Math.abs(s.v) * 50, col = s.v >= 0 ? 'var(--ok)' : 'var(--dgr)';
          return `<div class="sg">
            <span class="sn">${s.namn}</span>
            <span class="sb"><i style="background:${col};${s.v >= 0 ? 'left:50%' : `right:50%`};width:${w}%"></i></span>
            <span class="sv" style="color:${col}">${s.v >= 0 ? '+' : ''}${num(s.v, 2)}</span>
            <span class="sw2">${s.text} · vikt ${Math.round(s.vikt * 100)} %</span>
          </div>`;
        }).join('')}</div>
      </div>

      <div class="dsec">
        <h5>Beteende ${m.n} dagar</h5>
        <div class="kv">
          <span class="k">Visningar på tjänstesidan</span><span class="v">${nfk.format(m.nu.visningar)}</span>
          <span class="k">Påbörjade offertförfrågningar</span><span class="v">${m.nu.paborjade}</span>
          <span class="k">Avbrutna innan de skickades</span><span class="v">${m.nu.avbrutna} (${pct(m.avhopp)})</span>
          <span class="k">Skickade offerter</span><span class="v">${m.nu.skickade}</span>
          <span class="k">Vunna jobb</span><span class="v">${m.nu.vunna}</span>
          <span class="k">Förlorade offerter</span><span class="v">${m.forlorade}</span>
          <span class="k">Säljtempo</span><span class="v">${num(m.velNu, 1)} jobb/v (förra ${num(m.velForra, 1)})</span>
          <span class="k">Ledig kapacitet</span><span class="v">${t.ledig} av 8 veckor</span>
          <span class="k">Bokad omsättning</span><span class="v">${kr(m.oms)}</span>
        </div>
      </div>

      <div class="dsec">
        <h5>Spärrar</h5>
        <div class="gr">${gr.map(x => `<div class="${x.ok ? 'pass' : 'block'}">
          <svg viewBox="0 0 24 24">${x.ok ? '<path d="M4 12l5 5L20 6"/>' : '<path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/>'}</svg>
          <span>${x.txt}</span></div>`).join('')}
        </div>
      </div>

      <div class="dsec">
        <h5>Historik för tjänsten</h5>
        ${hist.length ? `<div class="hist">${hist.map(x => `<div class="he">
          <b>${kr(x.fran)} → ${kr(x.till)} <span style="font-weight:400;color:${x.till > x.fran ? 'var(--ok)' : 'var(--dgr)'}">
            ${x.till === x.fran ? '' : (x.till > x.fran ? '+' : '') + num((x.till - x.fran) / x.fran * 100, 1) + ' %'}</span></b>
          <span>${x.orsak}</span>
          <em>${x.ts.toLocaleDateString('sv-SE', { day:'numeric', month:'long', year:'numeric' })} · ${x.beslut} av ${x.av} · säkerhet ${Math.round(x.conf * 100)} %</em>
        </div>`).join('')}</div>`
        : `<p style="font-size:.74rem;color:var(--p28)">Ingen tidigare ändring. Ursprungspris ${kr(t.ursprungspris)}.</p>`}
      </div>
    </div>
    <div class="df">${fot}</div>`;

  document.getElementById('drawer').classList.add('on');
  document.getElementById('drawer').setAttribute('aria-hidden', 'false');
  document.getElementById('scrim').classList.add('on');
  render(false);
}
function closeDrawer() {
  if (state.reel) {
    const ov = document.getElementById('rov');
    state.valdId = null;
    if (ov) ov.classList.remove('on');
    document.querySelectorAll('.r-card').forEach(c => c.classList.remove('hl'));
    return;
  }
  state.valdId = null;
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('drawer').setAttribute('aria-hidden', 'true');
  document.getElementById('scrim').classList.remove('on');
  render(false);
}

/* ---------- 13. beslut ---------- */
function toast(rubrik, text, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<b>${rubrik}</b><span>${text}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.style.transition = '.3s'; el.style.opacity = 0; el.style.transform = 'translateX(20px)';
    setTimeout(() => el.remove(), 320); }, 4200);
}
function loggPost(ikon, rubrik, text) {
  state.logg.unshift({ ts: new Date(TODAY.getTime() + 11 * 36e5 + state.logg.length * 6e4), ikon, rubrik, text });
}

function godkann(id, av = 'Mathias') {
  const r = RAD.find(x => x.t.id === id); if (!r || r.rek.laast || r.rek.typ === 'oforandrat') return;
  const fran = r.t.pris, till = r.rek.nyttPris;
  state.historik.push({ ts: new Date(TODAY), tjanstId: id, tjanst: r.t.namn, fran, till, typ: r.rek.typ,
    orsak: r.text[0], conf: r.rek.conf, beslut: 'Godkänd', av });
  state.beslut[id] = { status: 'godkand', ts: new Date(TODAY).toISOString(), fran, till };
  r.t.pris = till; r.t.andrad = 0;
  loggPost('check', 'Prisändring tillämpad', `${r.t.namn}: ${kr(fran)} → ${kr(till)}`);
  toast('Prisändring tillämpad', `${r.t.namn} ligger nu på ${kr(till)}. Kylperiod ${state.regler.kylperiod} dagar startad.`, 'ok');
  spara(); berakna(); render(); if (state.valdId === id) openDrawer(id);
}
function avsla(id) {
  const r = RAD.find(x => x.t.id === id); if (!r) return;
  state.historik.push({ ts: new Date(TODAY), tjanstId: id, tjanst: r.t.namn, fran: r.t.pris, till: r.t.pris,
    typ: r.rek.typ, orsak: `Avslagen. Motorn föreslog ${kr(r.rek.nyttPris)}: ${r.text[0]}`, conf: r.rek.conf,
    beslut: 'Avslagen', av: 'Mathias' });
  state.beslut[id] = { status: 'avslagen', ts: new Date(TODAY).toISOString() };
  loggPost('no', 'Rekommendation avslagen', `${r.t.namn}: priset ligger kvar på ${kr(r.t.pris)}`);
  toast('Avslagen', `${r.t.namn} behåller ${kr(r.t.pris)}. Beslutet ligger i historiken.`, 'no');
  spara(); berakna(); render(); if (state.valdId === id) openDrawer(id);
}

function korAnalys() {
  const btn = document.getElementById('runBtn');
  btn.disabled = true; btn.textContent = 'Analyserar…';
  const rb = document.querySelector('[data-run]');
  if (rb) { rb.disabled = true; rb.textContent = 'Analyserar…'; }
  setTimeout(() => {
    state.korning++;
    berakna();
    let auto = 0;
    if (state.auto) {
      vantande().filter(r => Math.abs(r.rek.deltaPct) < state.regler.godkTroskel).forEach(r => { godkann(r.t.id, 'Autoläge'); auto++; });
    }
    berakna();
    const v = vantande().length;
    loggPost('spark', 'Prisanalys genomförd', `${synliga().length} tjänster analyserade på ${state.period} dagars beteendedata`);
    loggPost('tag', 'Rekommendationer genererade', `${v} väntar på granskning${auto ? `, ${auto} tillämpade av autoläget` : ''}`);
    spara();
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg> Kör prisanalys`;
    render();
    document.getElementById('body').classList.add('pulse');
    setTimeout(() => document.getElementById('body').classList.remove('pulse'), 900);
    toast('Analys klar', `${synliga().length} tjänster genomräknade. ${v} förslag väntar på dig${auto ? `, ${auto} tillämpades automatiskt` : ''}.`, 'ok');
  }, 620);
}

/* ---------- 14. render ---------- */
function render(full = true) {
  if (state.reel) {
    if (!full) {
      document.querySelectorAll('.r-card').forEach(c => c.classList.toggle('hl', c.dataset.open === state.valdId));
      return;
    }
    renderReel(); return;
  }
  renderNav(); renderTop(); renderSide();
  if (!full) {
    document.querySelectorAll('tbody tr').forEach(tr =>
      tr.classList.toggle('sel', tr.dataset.id === state.valdId));
    return;
  }
  const body = document.getElementById('body');
  body.innerHTML = state.vy === 'oversikt' ? vyOversikt()
    : state.vy === 'rek' ? `<div class="col">${panelRek(0)}${panelSim()}</div><div class="col">${panelInsikter()}${panelKat()}</div>`
    : state.vy === 'regler' ? vyRegler()
    : vyHistorik();
}

/* ---------- 15. händelser ---------- */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-vy]');
  if (nav) { state.vy = nav.dataset.vy; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }

  const seg = e.target.closest('#periodSeg button');
  if (seg) { state.period = +seg.dataset.p;
    document.querySelectorAll('#periodSeg button').forEach(b => b.classList.toggle('on', b === seg));
    berakna(); render(); if (state.valdId) openDrawer(state.valdId);
    toast('Period ändrad', `Alla mätvärden och rekommendationer räknas nu på ${state.period} dagar.`); return; }

  if (e.target.closest('#runBtn, [data-run]')) { korAnalys(); return; }
  if (e.target.closest('#autoSw, [data-auto]')) {
    state.auto = !state.auto; spara(); render();
    toast(state.auto ? 'Autoläge på' : 'Autoläge av', state.auto
      ? `Ändringar under ${state.regler.godkTroskel} % tillämpas vid nästa analys. Större väntar på dig.`
      : 'Inget pris ändras utan ditt godkännande.'); return; }
  if (e.target.closest('#review')) { state.vy = 'rek'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }

  const kat = e.target.closest('[data-kat]');
  if (kat) { state.kat = state.kat === kat.dataset.kat ? 'alla' : kat.dataset.kat; render(); return; }

  const app = e.target.closest('[data-app]'); if (app) { godkann(app.dataset.app); return; }
  const rej = e.target.closest('[data-rej]'); if (rej) { avsla(rej.dataset.rej); return; }

  if (e.target.closest('#dx, [data-close]') || e.target.id === 'scrim') { closeDrawer(); return; }

  const ins = e.target.closest('[data-open]'); if (ins) { openDrawer(ins.dataset.open); return; }
  const tr = e.target.closest('tbody tr[data-id]'); if (tr) { openDrawer(tr.dataset.id); return; }

  if (e.target.id === 'reset') {
    try { localStorage.removeItem(LS); } catch (err) {}
    location.reload(); return;
  }
});

document.getElementById('katSel').addEventListener('change', e => {
  state.kat = e.target.value; render();
});

document.addEventListener('change', e => {
  const rule = e.target.dataset.rule;
  if (rule) {
    state.regler[rule] = clamp(+e.target.value || 1, 1, rule === 'minVisningar' ? 5000 : 60);
    e.target.value = state.regler[rule];
    spara(); berakna(); render();
    toast('Prisregel uppdaterad', `${e.target.previousElementSibling ? '' : ''}Rekommendationerna är omräknade mot de nya spärrarna.`);
    loggPost('rule', 'Prisregel uppdaterad', `${rule} satt till ${state.regler[rule]}`);
    return;
  }
  const min = e.target.dataset.min, max = e.target.dataset.max;
  if (min || max) {
    const t = T(min || max);
    if (min) t.min = Math.min(+e.target.value || t.min, t.pris);
    if (max) t.max = Math.max(+e.target.value || t.max, t.pris);
    spara(); berakna(); render();
    toast('Prisspann uppdaterat', `${t.namn}: ${kr(t.min)} – ${kr(t.max)}.`);
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* ---------- 16. start ---------- */
berakna();
render();
</script>
</body>
</html>
