<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Smålands Måleri">
  <!-- Favicon och profilbild. Bara märket, ingen text: ordbilden blir oläslig
       under 32 px och SVG-text kan inte lita på att webbfonten finns.
       Solid bakgrund eftersom flera ytor inte hanterar genomskinlighet. -->
  <rect width="48" height="48" rx="9" fill="#181C38"/>
  <!-- Guldpenseldrag som sveper in över vänstra takfallet -->
  <path d="M7 31 C13 26 19 20 25 14" fill="none" stroke="#C9A96E" stroke-width="5.4" stroke-linecap="round"/>
  <!-- Taket -->
  <path d="M24 11 L40 26 h-4.6 L24 15.6 L12.6 26 H8 Z" fill="#F4F0E8"/>
  <!-- Skorsten -->
  <rect x="32.6" y="13.4" width="3.6" height="6" fill="#F4F0E8"/>
  <!-- Fönster, fyra rutor -->
  <rect x="21" y="29" width="2.6" height="2.6" fill="#F4F0E8"/>
  <rect x="24.4" y="29" width="2.6" height="2.6" fill="#F4F0E8"/>
  <rect x="21" y="32.4" width="2.6" height="2.6" fill="#F4F0E8"/>
  <rect x="24.4" y="32.4" width="2.6" height="2.6" fill="#F4F0E8"/>
</svg>
