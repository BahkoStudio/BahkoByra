        <h3>Ingredienser</h3><ul><li>2 burkar kokta bruna bönor eller favabönor (à 400g)</li><li>2–3 vitlöksklyftor, finhackade</li><li>1 liten lök, finhackad</li><li>1 stor tomat, hackad</li><li>1 grön chili, finhackad</li><li>1 dl färsk persilja, grovhackad</li><li>2–3 msk färsk salvia, finhackad</li><li>2 msk färsk mynta, finhackad</li><li>1 citron, saften</li><li>0,5 dl olivolja</li><li>Salt och svartpeppar</li></ul>
        <h3>Tillagning</h3><ol><li>Skölj bönorna noga och häll av vätskan.</li><li>Lägg i skål och blanda med alla grönsaker.</li><li>Ringla citron och olivolja.</li><li>Krydda med örter, salt och peppar.</li><li>Rör om och låt stå 5–10 min.</li></ol>
        <h3>Tips</h3><ul><li>Servera med libabröd</li><li>Kan göras dagen innan</li><li>Extra olivolja och citron vid servering</li><li>Prova med feta eller tahini</li></ul>
      </details>
      <details class="sr-recept" id="r-kycklingfile-potatis-dragon">
        <summary><img src="img/recept/kycklingfile-potatis-dragon.jpg" alt="" width="96" height="72" loading="lazy"><span><b>Stekt kycklingfilé med smörslungad potatis &amp; dragonsås</b><small>60 min · 3–4 portioner</small></span></summary>
        <p>Krämig dragonsås, saftig kyckling och smörstekta grönsaker – enkel men med känsla av vardagslyx.</p>
        <h3>Ingredienser</h3><h4>Kyckling</h4><ul><li>3 kycklingfiléer</li><li>Salt och svartpeppar</li><li>Smör och olja till stekning</li><li>Färsk timjan eller rosmarin (valfritt)</li></ul><h4>Potatis &amp; grönsaker</h4><ul><li>800g delikatesspotatis</li><li>1 röd, 1 gul, 1 orange paprika</li><li>1 stor rödlök</li><li>Ca 300g brysselkål</li><li>50–75g smör</li><li>Salt och svartpeppar</li></ul><h4>Dragonsås</h4><ul><li>2 dl vispgrädde</li><li>1 dl crème fraîche</li><li>1–2 tsk dijonsenap</li><li>1 tsk vitvinsvinäger</li><li>1–2 tsk torkad dragon</li><li>Salt och svartpeppar</li></ul>
        <h3>Tillagning</h3><h4>Kycklingen</h4><ol><li>Förvärm ugn 150°C. Krydda filéerna. Bryn i smör+olja 2–3 min/sida.</li><li>Lägg i ugnsform, tillsätt smör eller buljong. Tillaga till 70–72°C innetemperatur.</li><li>Låt vila 5–10 min.</li></ol><h4>Potatis &amp; grönsaker</h4><ol><li>Koka potatis nästan klar. Halvera. Förkoka brysselkål 3 min.</li><li>Stek potatis gyllenbrun. Tillsätt grönsaker, stek 10 min. Avsluta med smörklick.</li></ol><h4>Dragonsås</h4><ol><li>Koka grädde och crème fraîche. Vispa ner senap, dragon och vinäger.</li><li>Sjuda 5–10 min tills lätt tjocknat. Smaka av.</li></ol><h4>Servering</h4><ol><li>Skär kycklingen i sneda skivor. Lägg på grönsaker och ringla sås.</li></ol>
        <h3>Tips</h3><ul><li>Kötttermometer ger perfekt resultat</li><li>Dragonsåsen kan göras i förväg</li><li>Zucchini och sparris passar också bra</li></ul>
      </details>
      <details class="sr-recept" id="r-friterad-kyckling-bbq">
        <summary><img src="img/friterad-kyckling-bbq.jpg" alt="" width="96" height="72" loading="lazy"><span><b>Friterad kyckling med BBQ-glaze &amp; vitlöksmajonnäs 😍🔥</b><small>90 min · 4 portioner</small></span></summary>
        <p>Krispig friterad kyckling penslad med en kladdig BBQ- och ketchupglaze, och en snabb vitlöksmajonnäs till. Vår perfekta fredagsmiddag!</p>
        <h3>Ingredienser</h3><h4>Friterad kyckling</h4><ul><li>1 paket färska kycklingfiléer</li><li>4 dl grädde</li><li>½ dl soja</li><li>1 msk vitlökspulver</li><li>1 msk lökpulver</li><li>1 msk rökt paprikapulver</li><li>½ msk salt</li><li>Svartpeppar</li><li>3 msk chilisås</li></ul><h4>Panering</h4><ul><li>5–6 dl vetemjöl</li><li>1 msk vitlökspulver</li><li>1 msk lökpulver</li><li>1 msk chicken cajun-krydda</li><li>En nypa salt</li><li>Svartpeppar</li><li>Frityrolja</li></ul><h4>Vitlöksmajonnäs</h4><ul><li>1 dl majonnäs</li><li>½ tsk sesamolja</li><li>1 liten vitlöksklyfta, pressad</li><li>En nypa cayennepeppar</li><li>En nypa salt</li></ul><h4>BBQ- &amp; ketchupglaze</h4><ul><li>1 dl ketchup</li><li>½ dl soja</li><li>½ dl valfri BBQ-sås</li><li>Chili efter smak</li><li>Lite färskpressad lime</li></ul>
        <h3>Tillagning</h3><h4>Marinera kycklingen</h4><ol><li>Skär kycklingfiléerna på mitten.</li><li>Blanda grädde, soja, vitlökspulver, lökpulver, rökt paprikapulver, salt, svartpeppar och chilisås.</li><li>Lägg ner kycklingen och blanda ordentligt så att alla bitar täcks.</li><li>Täck över och låt marinera i kylen i cirka 1 timme.</li></ol><h4>Panera &amp; fritera</h4><ol><li>Blanda allt till paneringen i en skål.</li><li>Ta kycklingen direkt från marinaden och vänd ordentligt i mjölblandningen. Tryck gärna in mjölet lite med händerna så får du en extra krispig och härlig yta.</li><li>Lägg de panerade kycklingbitarna på en plåt medan du panerar resten.</li><li>Hetta upp frityroljan till cirka 170–180°C och fritera kycklingen, gärna en bit åt gången, tills den är gyllene, krispig och helt genomstekt.</li><li>Förvara den färdigfriterade kycklingen varmt i ugnen medan du gör resten.</li></ol><h4>Vitlöksmajonnäs</h4><ol><li>Blanda ihop allt och smaka av. Enkelt och SÅ gott till kycklingen!</li></ol><h4>Glaze &amp; servering</h4><ol><li>Blanda ihop allt till glazen till en härligt kladdig sås.</li><li>Pensla den varma, krispiga kycklingen ordentligt med BBQ-glazen precis innan servering.</li></ol>
        <h3>Tips</h3><ul><li>Tryck in mjölet med händerna – det ger en extra krispig yta</li><li>Fritera gärna en bit i taget så håller oljan temperaturen</li><li>Håll oljan på 170–180°C</li><li>Håll den färdiga kycklingen varm i ugnen medan du friterar resten</li><li>Pensla på glazen precis innan servering</li></ul>
      </details>
      <details class="sr-recept" id="r-humse-qarhone">
        <summary><img src="img/humse-qarhone.jpg" alt="" width="96" height="72" loading="lazy"><span><b>Humse qarhone</b><small>60 min · 4 portioner</small></span></summary>
        <p>En otroligt god, smakrik och proteinrik assyrisk/syriansk kikärtsgryta med bulgurbollar.</p>
        <h3>Ingredienser</h3><h4>Bulgurbollar</h4><ul><li>2 dl bulgur, finmald</li><li>2 dl shiche, finmald</li><li>Vatten</li><li>0,5 dl mannagryn</li><li>2 tsk salt</li><li>2 tsk svartpeppar</li><li>1 msk torkad mynta</li></ul><h4>Tomatsås</h4><ul><li>1 gul lök, finhackad</li><li>3–4 klyftor vitlök, finhackade</li><li>3–4 msk olivolja</li><li>1 msk tomatpuré</li><li>Ca 1,5 l vatten</li><li>480 g kikärtor (i tetrapack)</li><li>0,5 msk citronpeppar</li><li>1 msk salt</li><li>1 msk paprikapulver</li><li>0,5 msk chiliflakes</li></ul>
        <h3>Tillagning</h3><h4>Bulgurbollar</h4><ol><li>Blanda bulgursorterna och häll över vatten tills det täcker. Låt vila 20 minuter under lock.</li><li>Tillsätt mannagryn, salt, peppar och torkad mynta. Knåda tills degen håller ihop, tillsätt vatten gradvis.</li><li>Forma små bollar med fuktiga händer.</li></ol><h4>Tomatsås</h4><ol><li>Fräs lök och vitlök i olivolja.</li><li>Tillsätt tomatpurén och stek några minuter.</li><li>Häll i vatten och kryddor. Låt småkoka 10 minuter.</li><li>Sila och häll ner kikärtorna.</li><li>Tillsätt bulgurbollarna och låt småkoka 10 minuter.</li><li>Justera vätska, salt och peppar efter behov.</li></ol>
        <h3>Tips</h3><ul><li>Servera med salladslök, mynta och pressad citron</li></ul>
      </details>
      <details class="sr-recept" id="r-hummus-x3">
        <summary><img src="img/hummus-x3.jpg" alt="" width="96" height="72" loading="lazy"><span><b>Hummus x 3</b><small>20 min · 4–6 portioner</small></span></summary>
        <p>Grundreceptet på min hummus, där kikärtornas karaktär får stå i rampljuset. Krämig, syrlig och supergod – plus två smaksättningar.</p>
        <h3>Ingredienser</h3><h4>Grundrecept</h4><ul><li>800 g kikärtor (i tetrapack)</li><li>3 vitlöksklyftor</li><li>Saft från 2 citroner</li><li>0,5 msk salt</li><li>1 dl tahini/sesampasta</li><li>1 dl vatten</li></ul><h4>Smaksättning 1: paprika &amp; harissa</h4><ul><li>1,5 msk paprikapuré</li><li>1 msk harissa</li><li>Granatäppelkärnor</li><li>Krasse</li><li>Olivolja</li></ul><h4>Smaksättning 2: gurkmeja &amp; koriander</h4><ul><li>2 msk malen gurkmeja</li><li>1 tsk malen spiskummin</li><li>1 tsk korianderfrön</li><li>Olivolja</li><li>Kikärtor</li><li>Färsk mynta</li></ul>
        <h3>Tillagning</h3><h4>Grundrecept</h4><ol><li>Skölj och låt kikärtorna rinna av, mixa dem sedan släta.</li><li>Tillsätt vitlöken och fortsätt mixa. Pressa i citronsaften, tillsätt salt och tahini. Tillsätt vattnet gradvis under mixning tills den blir krämig och binder ihop sig.</li><li>Lägg upp på ett fat, ringla över olivolja och avsluta med chiliflakes och sumak.</li></ol><h4>Smaksättning 1</h4><ol><li>Tillsätt 1,5 msk paprikapuré och 1 msk harissa till grundreceptet. Mixa en gång till.</li><li>Toppa med olivolja, granatäppelkärnor och krasse.</li></ol><h4>Smaksättning 2</h4><ol><li>Gör grundreceptet och tillsätt 2 msk gurkmeja, 1 tsk spiskummin och 1 tsk koriander. Mixa.</li><li>Servera toppad med olivolja, kikärtor och färsk mynta.</li></ol>
        <h3>Tips</h3><ul><li>Gör grundreceptet först och dela sedan upp det om du vill göra flera smaker</li></ul>
      </details>
      <details class="sr-recept" id="r-lahmo-do-bayto">
        <summary><img src="img/lahmo-do-bayto.jpg" alt="" width="96" height="72" loading="lazy"><span><b>Lahmo do bayto</b></span></summary>
        <p>Mjukt hembakat bröd – assyriskt/syrianskt husets bröd. Mjuk, smidig deg som gräddas till gyllene, fluffiga bröd.</p>
        <h3>Ingredienser</h3><h4>Deg</h4><ul><li>50 g färsk jäst</li><li>8 dl fingervarmt vatten</li><li>1 msk salt</li><li>¾ dl rapsolja</li><li>Ca 17–18 dl vetemjöl</li></ul>
        <h3>Tillagning</h3><h4>Gör degen</h4><ol><li>Smula jästen i en stor bunke och lös upp den i det fingervarma vattnet.</li><li>Tillsätt salt och rapsolja.</li><li>Arbeta in mjölet lite i taget. Börja med cirka 16 dl och tillsätt mer vid behov. Degen ska vara mjuk, smidig och gärna lite klibbig – undvik att tillsätta för mycket mjöl.</li><li>Knåda degen ordentligt och låt den jäsa övertäckt tills den har ungefär dubblat sin storlek.</li></ol><h4>Forma och grädda</h4><ol><li>Dela degen i lika stora bitar och forma dem till runda bröd. Ha lite olja på händerna och platta försiktigt till bröden.</li><li>Lägg bröden på en plåt med bakplåtspapper och låt jäsa ytterligare 30 minuter.</li><li>Grädda i 220°C varmluft i cirka 20 minuter, eller tills bröden har fått en fin gyllene färg.</li></ol>
        <h3>Tips</h3><ul><li>Degen ska vara lite klibbig – för mycket mjöl ger torrt bröd</li><li>Olja på händerna gör det lätt att forma bröden</li><li>Gräddas i 220°C varmluft, cirka 20 minuter</li></ul>
      </details>

  'kofta-bil-sanieh': {

  const ingsHtml = r.ingredients.map(s => `

  const instHtml = r.instructions.map(s => `

  const tips    = tv(r.tips, r.tips_en);
  const tipsHtml = tips ? `
    <div class="recipe-tips">
      <div class="card-title">${getT('r.tips')}</div>

  container.innerHTML = `
    <div class="recipe-hero">
      <div class="recipe-hero-img"><img src="${r.image}" alt="${title}" loading="eager"></div>
      <div class="recipe-hero-content">
        <div class="recipe-badges"><span class="recipe-badge-tag recipe-badge-blogg">${tv('Bloggrecept', 'Blog recipe')}</span>${r.badges.map(b => `<span class="recipe-badge-tag">${tagText(b)}</span>`).join('')}</div>
        <h1 class="recipe-title">${title}</h1>

        <div class="card-title">${getT('r.ingredients')}</div>
        ${ingsHtml}

      <div class="recipe-instructions">
        <div class="recipe-instructions-card">
          <div class="card-title">${getT('r.instructions')}</div>
          ${instHtml}
        </div>
        ${tipsHtml}
      </div>
    </div>
    <aside class="bok-puff">
      <img src="img/bok-fram.jpg" alt="" width="72" height="100">
      <div>
        <strong>Maykas gröna kök</strong>
        <p>${tv('Cirka 50 recept till i min kokbok, inbunden. 349&nbsp;kr.', 'About 50 more recipes in my cookbook, hardcover, in Swedish. 349&nbsp;kr.')}</p>
      </div>
      <a href="https://clk.tradedoubler.com/click?p=362&amp;a=3477349&amp;url=https%3A%2F%2Fwww.bokus.com%2Fbok%2F9789190032091%2Fmaykas-grona-kok-kutle-hummus-och-karlek%2F" target="_blank" rel="sponsored noopener">${tv('Köp min bok här', 'Buy my book here')}</a>
    </aside>`;
}

/* ── LISTA: alla recept när inget id anges ── */
const CHIPS = ['Vegetariskt', 'Vegan', 'Kött', 'Kyckling', 'Bakverk', 'Snabb', 'Traditionellt'];
let aktivChip = 'alla';

function tagText(label) {
  const k = typeof tagKey === 'function' ? tagKey(label) : null;
  return k ? getT(k) : label;
}

function renderList() {
  const container = document.getElementById('recipe-content');
  container.className = '';
  document.getElementById('back-btn').hidden = true;
  document.title = getT('list.title') + ' – Mayka Gulo';

  const alla = Object.entries(RECIPES);
  const synliga = alla.filter(([, r]) => aktivChip === 'alla' || r.badges.includes(aktivChip) || (aktivChip === 'Vegetariskt' && r.badges.includes('Vegan')));

  const chips = ['alla', ...CHIPS].map(c =>
    `<button class="chip${c === aktivChip ? ' is-on' : ''}" data-chip="${c}">${c === 'alla' ? getT('list.all') : tagText(c)}</button>`).join('');

  const bokKort = `
    <a class="rcard bok-kort" href="https://clk.tradedoubler.com/click?p=362&amp;a=3477349&amp;url=https%3A%2F%2Fwww.bokus.com%2Fbok%2F9789190032091%2Fmaykas-grona-kok-kutle-hummus-och-karlek%2F" target="_blank" rel="sponsored noopener">
      <div class="bok-kort-bild"><img src="img/bok-fram.jpg" alt="${tv('Omslaget till kokboken Maykas gröna kök', 'Cover of the cookbook Maykas gröna kök')}" width="1100" height="1534"></div>
      <div class="rcard-body">
        <div class="rcard-tags"><span>${tv('Min kokbok', 'My cookbook')}</span></div>
        <h3>Maykas gröna kök</h3>
        <p>${tv('Kutle, hummus &amp; kärlek. Cirka 50 recept, 160 sidor, inbunden.', 'Kutle, hummus &amp; kärlek. About 50 recipes, 160 pages, hardcover, in Swedish.')}</p>
        <div class="rcard-foot"><span class="bok-kort-pris">349 kr</span><b>${tv('Köp min bok här', 'Buy my book here')}</b></div>
      </div>
    </a>`;

  const kort = synliga.map(([id, r]) => `
    <a class="rcard" href="recept.html?id=${id}">
      <div class="rcard-img"><img src="${r.image}" alt="${tv(r.title, r.title_en)}" loading="lazy"></div>
      <div class="rcard-body">
        <div class="rcard-tags">${r.badges.slice(0, 3).map(b => `<span>${tagText(b)}</span>`).join('')}</div>
        <h3>${tv(r.title, r.title_en)}</h3>
        <p>${tv(r.description, r.description_en)}</p>
        <div class="rcard-foot">
          <span>${[r.time ? r.time + ' ' + getT('r.min') : '', r.portions ? r.portions + ' ' + getT('r.portions') : ''].filter(Boolean).join(' · ')}</span>
          <b>${getT('recipe.view')}</b>
        </div>
      </div>
    </a>`).join('');

  container.innerHTML = `
    <div class="list-head">
      <span class="kicker">${synliga.length} ${getT('list.count')}</span>
      <h1 class="list-title">${getT('list.title')}</h1>
      <p class="list-sub">${getT('list.sub')}</p>
    </div>
    <div class="chips">${chips}</div>
    <div class="list-grid">${bokKort}${kort || `<p class="list-empty">–</p>`}</div>`;

  container.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    aktivChip = b.dataset.chip;
    renderList();
  }));
}

window.MK_RENDER = RECIPE_ID ? render : renderList;
window.MK_RENDER();
initLangToggle();
</script>
