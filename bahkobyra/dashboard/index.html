<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F3EA">
<title>Bahko CRM</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --cream:#F7F3EA;--cream-2:#F1EBDF;--white:#FFFDF9;
  --navy:#181C38;--navy-2:#12152E;
  --gold:#C9A96E;--gold-lt:#E3C88E;--gold-dk:#B08F4D;
  --ink:#181C38;--ink-70:rgba(24,28,56,.72);--ink-50:rgba(24,28,56,.5);--ink-30:rgba(24,28,56,.3);
  --line:rgba(201,169,110,.26);--line-2:rgba(201,169,110,.55);
  --ok:#4F9D6B;--danger:#C0392B;
  --disp:'Cormorant Garamond',Georgia,serif;--sans:'Outfit',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
html{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
::selection{background:var(--gold);color:var(--navy)}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:40;background:rgba(247,243,234,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-2);padding:.85rem clamp(1rem,3vw,2rem);
  display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.65rem;font-family:var(--disp);font-size:1.45rem;font-weight:600}
.brand img{height:34px;display:block}
.brand em{font-style:italic;color:var(--gold-dk)}
.brand .tag{font-family:var(--sans);font-size:.55rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink-30);border-left:1px solid var(--line-2);padding-left:.65rem;margin-left:.1rem}
.search{flex:1;min-width:180px;max-width:420px;display:flex;align-items:center;gap:.5rem;
  background:var(--white);border:1px solid var(--line-2);border-radius:100px;padding:.5rem 1rem}
.search svg{width:14px;height:14px;stroke:var(--gold-dk);stroke-width:2.4;fill:none;flex-shrink:0}
.search input{border:none;outline:none;background:none;width:100%;font-size:.85rem}
.hactions{display:flex;gap:.5rem;flex-wrap:wrap;margin-left:auto}
.hbtn{font-size:.68rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  padding:.55rem 1.05rem;border-radius:100px;border:1px solid var(--line-2);color:var(--ink-70);transition:.22s}
.hbtn:hover{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.hbtn.solid{background:var(--navy);border-color:var(--navy);color:var(--white)}
.hbtn.solid:hover{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.hmore{position:relative}
.hmenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--white);border:1px solid var(--line-2);
  border-radius:12px;box-shadow:0 18px 44px -18px rgba(24,28,56,.35);min-width:190px;padding:.4rem;display:none;z-index:50}
.hmenu.open{display:block}
.hmenu button,.hmenu a{display:block;width:100%;text-align:left;font-size:.78rem;padding:.55rem .8rem;border-radius:8px}
.hmenu button:hover,.hmenu a:hover{background:var(--cream-2)}

.wrap{max-width:1400px;margin:0 auto;padding:1.6rem clamp(1rem,3vw,2rem) 4rem}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.8rem;margin-bottom:1.6rem}
.stat{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem;
  display:flex;flex-direction:column;gap:.15rem;transition:.25s}
.stat .v{font-family:var(--disp);font-size:2.1rem;font-weight:600;line-height:1;color:var(--navy)}
.stat .l{font-size:.6rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-50)}
.stat.warn{border-color:rgba(192,57,43,.35)}
.stat.warn .v{color:var(--danger)}
.stat.gold{border-color:var(--line-2);background:linear-gradient(135deg,var(--white),#FBF4E6)}
.stat.gold .v{color:var(--gold-dk)}

/* ── SECTION HEADS ── */
.kick{font-size:.62rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-dk);
  display:flex;align-items:center;gap:.7rem;margin:0 0 .8rem}
.kick::before{content:'';width:26px;height:1px;background:var(--gold)}
.kick .hint{margin-left:auto;font-weight:400;letter-spacing:.08em;color:var(--ink-30);text-transform:none;font-size:.62rem}

/* ── IDAG ── */
.due{background:var(--navy);color:var(--white);border-radius:16px;padding:1.1rem 1.3rem;margin-bottom:1.8rem;
  border:1px solid rgba(201,169,110,.35)}
.due .kick{color:var(--gold-lt)}
.due .kick::before{background:var(--gold-lt)}
.due-row{display:flex;align-items:center;gap:.8rem;padding:.55rem 0;border-bottom:1px solid rgba(247,243,234,.1);font-size:.85rem;flex-wrap:wrap}
.due-row:last-child{border-bottom:none}
.due-row .nm{font-weight:600;cursor:pointer}
.due-row .nm:hover{color:var(--gold-lt)}
.due-row .meta{font-size:.66rem;color:rgba(247,243,234,.55);letter-spacing:.04em}
.due-row .spacer{margin-left:auto}
.dbtn{font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.38rem .8rem;
  border-radius:100px;border:1px solid rgba(227,200,142,.5);color:var(--gold-lt);transition:.2s;flex-shrink:0}
.dbtn:hover{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.due-empty{font-size:.83rem;color:rgba(247,243,234,.65);padding:.3rem 0}

/* ── BOARD ── */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(238px,1fr);gap:.8rem;
  overflow-x:auto;padding-bottom:1rem;scroll-snap-type:x proximity}
.col{background:var(--cream-2);border:1px solid var(--line);border-radius:14px;padding:.7rem;
  display:flex;flex-direction:column;gap:.6rem;min-height:280px;scroll-snap-align:start;transition:border-color .2s,background .2s}
.col.over{border-color:var(--gold);background:#EFE6D2}
.col-h{display:flex;align-items:center;gap:.5rem;padding:.15rem .3rem}
.col-h .t{font-family:var(--disp);font-size:1.08rem;font-weight:600}
.col-h .n{margin-left:auto;font-size:.62rem;font-weight:700;min-width:1.5rem;height:1.5rem;padding:0 .35rem;
  border-radius:100px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center}
.col-h .n.zero{background:var(--line);color:var(--ink-30)}
.cards{display:flex;flex-direction:column;gap:.55rem;flex:1}
.cardc{background:var(--white);border:1px solid var(--line);border-radius:11px;padding:.75rem .85rem;cursor:grab;
  transition:transform .18s var(--ease),box-shadow .18s,border-color .18s;position:relative}
.cardc:hover{transform:translateY(-2px);box-shadow:0 12px 26px -18px rgba(24,28,56,.5);border-color:var(--line-2)}
.cardc:active{cursor:grabbing}
.cardc.drag{opacity:.45;transform:rotate(1.5deg)}
.cardc .nm{font-weight:600;font-size:.86rem;line-height:1.3}
.cardc .city{font-size:.66rem;color:var(--ink-50);margin-top:.1rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.57rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:.22rem .55rem;border-radius:100px;margin-top:.5rem}
.chip.due{background:rgba(192,57,43,.1);color:var(--danger)}
.chip.plan{background:rgba(201,169,110,.16);color:var(--gold-dk)}
.chip.rest{background:var(--cream-2);color:var(--ink-30)}
.chip.won{background:rgba(79,157,107,.14);color:var(--ok)}
.col-empty{font-size:.68rem;color:var(--ink-30);text-align:center;padding:1rem .4rem;border:1px dashed var(--line);border-radius:10px}

/* ── DRAWER ── */
.scrim{position:fixed;inset:0;background:rgba(24,28,56,.45);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:.28s;z-index:60}
.scrim.open{opacity:1;pointer-events:all}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);background:var(--cream);z-index:70;
  transform:translateX(102%);transition:transform .32s var(--ease);display:flex;flex-direction:column;
  border-left:1px solid var(--line-2);box-shadow:-24px 0 60px -30px rgba(24,28,56,.5)}
.drawer.open{transform:none}
.dr-head{padding:1.2rem 1.4rem .9rem;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:.8rem}
.dr-head h3{font-family:var(--disp);font-size:1.5rem;font-weight:600;line-height:1.15;flex:1}
.dr-close{font-size:1.5rem;color:var(--ink-30);line-height:1;padding:.1rem .3rem}
.dr-close:hover{color:var(--ink)}
.dr-body{flex:1;overflow-y:auto;padding:1.1rem 1.4rem}
.dr-quick{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.1rem}
.q{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.42rem .85rem;
  border-radius:100px;border:1px solid var(--line-2);color:var(--gold-dk);transition:.2s}
.q:hover{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.field{margin-bottom:.75rem}
.field label{display:block;font-size:.58rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-50);margin-bottom:.28rem}
.field input,.field select,.field textarea{width:100%;font-size:.85rem;padding:.55rem .75rem;
  border:1px solid var(--line-2);border-radius:9px;background:var(--white);outline:none;transition:.2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:vertical;min-height:110px;line-height:1.55}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.cad{margin:.2rem 0 1rem}
.cad-track{display:flex;gap:.35rem;margin:.35rem 0 .45rem}
.pill{flex:1;text-align:center;font-size:.6rem;font-weight:700;padding:.4rem 0;border-radius:8px;
  background:var(--white);border:1px solid var(--line);color:var(--ink-30);cursor:pointer;user-select:none;transition:.15s}
.pill:hover{border-color:var(--gold);color:var(--gold-dk)}
.pill.done{background:rgba(79,157,107,.14);color:var(--ok);border-color:rgba(79,157,107,.35)}
.pill.next{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.cad-meta{font-size:.68rem;color:var(--ink-50)}
.touch{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.5rem 1rem;
  border-radius:100px;background:var(--navy);color:var(--white);transition:.2s;margin-top:.4rem}
.touch:hover{background:var(--gold);color:var(--navy)}
.dr-foot{padding:.9rem 1.4rem;border-top:1px solid var(--line);display:flex;gap:.6rem;align-items:center}
.save{flex:1;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  padding:.75rem;border-radius:100px;background:var(--gold);color:var(--navy);transition:.2s}
.save:hover{background:var(--gold-lt)}
.del{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:.72rem 1rem;
  border-radius:100px;border:1px solid rgba(192,57,43,.3);color:var(--danger);transition:.2s}
.del:hover{background:var(--danger);color:#fff;border-color:var(--danger)}

footer{padding:1.4rem;text-align:center;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-30);border-top:1px solid var(--line)}
footer a{color:var(--gold-dk)}

@media(max-width:700px){
  .brand .tag{display:none}
  .board{grid-auto-columns:82vw}
  .frow{grid-template-columns:1fr}
}
</style>
</head>

  </div>
  <div class="dr-foot">
    <button class="del" id="dr-del" style="display:none">Radera</button>
    <button class="save" id="dr-save">Spara</button>
  </div>
</aside>

<footer>Bahko Byrå · CRM · <a href="/cloud/sop-ringa/">Ring-SOP</a> · data sparas lokalt i webbläsaren — ta backup varje fredag</footer>

/* ── STATE ── */
function norm(l){return Object.assign({id:'',name:'',web:'',contact:'',phone:'',email:'',city:'',status:'Ny',pathway:'samtal',notes:'',cadenceDay:'',nextAction:'',lastTouch:'',updated:today},l);}
function loadDeleted(){try{const d=JSON.parse(localStorage.getItem(DEL_KEY));return new Set(Array.isArray(d)?d:[]);}catch{return new Set();}}
function markDeleted(id){const d=loadDeleted();d.add(id);localStorage.setItem(DEL_KEY,JSON.stringify([...d]));}
function load(){
  let st=null;
  const mig=(()=>{try{return JSON.parse(localStorage.getItem(MIG_KEY))||{};}catch{return {};}})();
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      st=JSON.parse(raw)
        .filter(l=>l&&l.niche!=='klinik'&&!/^s\d/.test(String(l.id)))
        .map(norm)
        // Gamla plattformens statusar viks in i pipelinens kolumner
        .map(l=>{if(l.status==='Uppföljning 2'||l.status==='Uppföljning 3')l.status='Kontaktad';if(!STATUSES.includes(l.status))l.status='Ny';return l;});
      // Engångsmigrering — får inte köras vid varje laddning, annars skrivs manuella flyttar över
      if(!mig.b02){
        const b02=st.find(l=>l.id==='b02');
        if(b02&&b02.status!=='Stängd'){b02.status='Stängd';b02.notes=('KUND — sajt levererad juli 2026: brommatradgardsservice.se. '+(b02.notes||'')).trim();}
        mig.b02=true;localStorage.setItem(MIG_KEY,JSON.stringify(mig));
      }
    }
  }catch{}
  if(!st){st=SEED.map(norm);save(st);return st;}
  const deleted=loadDeleted();
  const have=new Set(st.map(l=>l.id));
  const names=new Set(st.map(l=>l.name.toLowerCase().replace(/\s+/g,'')));
  let changed=false;
  SEED.forEach(s=>{
    if(deleted.has(s.id))return;
    if(!have.has(s.id)&&!names.has(s.name.toLowerCase().replace(/\s+/g,''))){st.push(norm(s));changed=true;}
  });
  if(changed)save(st);
  return st;
}
function save(arr){localStorage.setItem(KEY,JSON.stringify(arr));}
let leads=load(),editId=null;

/* ── CADENCE ── */
function addDays(iso,n){const d=new Date(iso||today);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function logTouch(l){
  l.lastTouch=today;l.updated=today;
  if(l.status==='Ny')l.status='Kontaktad';
  const d=l.cadenceDay;
  if(d===''||d==null){l.cadenceDay=1;l.nextAction=addDays(today,2);}
  else if(d==='nurture'){l.nextAction=addDays(today,30);}
  else{
    const i=CAD.indexOf(+d);
    if(i<0||i>=CAD.length-1){l.cadenceDay='nurture';l.nextAction=addDays(today,30);}
    else{l.cadenceDay=CAD[i+1];l.nextAction=addDays(today,CAD[i+1]-CAD[i]);}
  }
}
function setCad(l,d){
  if(d===''||d==null){l.cadenceDay='';l.nextAction='';l.lastTouch='';return;}
  if(l.status==='Ny')l.status='Kontaktad';
  l.lastTouch=today;l.updated=today;
  if(d==='nurture'){l.cadenceDay='nurture';l.nextAction=addDays(today,30);return;}
  const i=CAD.indexOf(+d);
  l.cadenceDay=CAD[i];
  l.nextAction=(i>=CAD.length-1)?addDays(today,30):addDays(today,CAD[i+1]-CAD[i]);
}
function nextLbl(l){
  if(CLOSED.includes(l.status))return '';
  if(l.cadenceDay==='nurture')return 'nurture';
  if(l.cadenceDay===''||l.cadenceDay==null)return 'dag 1';
  const i=CAD.indexOf(+l.cadenceDay);
  return (i>=0&&i<CAD.length-1)?('dag '+CAD[i+1]):'nurture';
}
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ── RENDER: STATS ── */
function renderStats(){
  const due=leads.filter(l=>l.nextAction&&l.nextAction<=today&&!CLOSED.includes(l.status)).length;
  const active=leads.filter(l=>!CLOSED.includes(l.status)).length;
  const meet=leads.filter(l=>l.status==='Möte'||l.status==='Offert').length;
  const won=leads.filter(l=>l.status==='Stängd').length;
  document.getElementById('stats').innerHTML=`
    <div class="stat ${due?'warn':''}"><span class="v">${due}</span><span class="l">Att följa upp idag</span></div>
    <div class="stat"><span class="v">${active}</span><span class="l">Aktiva leads</span></div>
    <div class="stat gold"><span class="v">${meet}</span><span class="l">Möte / offert</span></div>
    <div class="stat"><span class="v">${won}</span><span class="l">Kunder</span></div>`;
}

/* ── RENDER: IDAG ── */
function renderDue(){
  const box=document.getElementById('due-list');
  const due=leads.filter(l=>l.nextAction&&l.nextAction<=today&&!CLOSED.includes(l.status))
    .sort((a,b)=>a.nextAction.localeCompare(b.nextAction));
  document.getElementById('due-hint').textContent=due.length?due.length+' st — kör cadencen':'';
  if(!due.length){box.innerHTML='<div class="due-empty">Inget förfallet — ring nya leads eller fyll på listan. 🎉</div>';return;}
  box.innerHTML=due.map(l=>`<div class="due-row">
    <span class="nm" data-open="${l.id}">${esc(l.name)}</span>
    <span class="meta">${PATH[l.pathway]||''} · ${nextLbl(l)} · förföll ${l.nextAction}</span>
    <span class="spacer"></span>
    ${l.phone?`<a class="dbtn" href="tel:${esc(l.phone.replace(/[^\d+]/g,''))}">Ring</a>`:''}
    <button class="dbtn" data-touch="${l.id}">✓ Touch</button>
  </div>`).join('');
}
document.getElementById('due-list').addEventListener('click',e=>{
  const t=e.target.closest('[data-touch]'),o=e.target.closest('[data-open]');
  if(t){const l=leads.find(x=>x.id===t.dataset.touch);if(l){logTouch(l);save(leads);renderAll();}}
  else if(o)openDrawer(o.dataset.open);
});

/* ── RENDER: BOARD ── */
function chip(l){
  if(l.status==='Stängd')return '<span class="chip won">Kund</span>';
  if(CLOSED.includes(l.status))return '';
  if(!l.nextAction)return '<span class="chip rest">starta cadence</span>';
  if(l.nextAction<=today)return `<span class="chip due">förfallen · ${nextLbl(l)}</span>`;
  return `<span class="chip plan">${nextLbl(l)} · ${l.nextAction}</span>`;
}
function renderBoard(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const board=document.getElementById('board');
  board.innerHTML=STATUSES.map(st=>{
    const items=leads.filter(l=>l.status===st&&(!q||(l.name+' '+l.city+' '+l.contact+' '+l.notes).toLowerCase().includes(q)))
      .sort((a,b)=>(a.nextAction||'9999').localeCompare(b.nextAction||'9999')||a.name.localeCompare(b.name,'sv'));
    return `<div class="col" data-col="${esc(st)}">
      <div class="col-h"><span class="t">${esc(st)}</span><span class="n ${items.length?'':'zero'}">${items.length}</span></div>
      <div class="cards">${items.map(l=>`
        <div class="cardc" draggable="true" data-id="${l.id}">
          <div class="nm">${esc(l.name)}</div>
          ${l.city?`<div class="city">${esc(l.city)}</div>`:''}
          ${chip(l)}
        </div>`).join('')||'<div class="col-empty">tomt</div>'}</div>
    </div>`;
  }).join('');
}
/* klick = öppna, drag = flytta status */
document.getElementById('board').addEventListener('click',e=>{
  const c=e.target.closest('.cardc');if(c)openDrawer(c.dataset.id);
});
let dragId=null;
document.getElementById('board').addEventListener('dragstart',e=>{
  const c=e.target.closest('.cardc');if(!c)return;
  dragId=c.dataset.id;c.classList.add('drag');
  e.dataTransfer.effectAllowed='move';
  try{e.dataTransfer.setData('text/plain',dragId);}catch{}
});
document.getElementById('board').addEventListener('dragend',e=>{
  const c=e.target.closest('.cardc');if(c)c.classList.remove('drag');
  document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'));
  stopAutoScroll();
});
/* auto-scroll: när ett kort dras nära brädans kant scrollar brädan åt det hållet */
const boardEl=document.getElementById('board');
let scrollDir=0,scrollRaf=null;
function autoScroll(){
  if(!scrollDir){scrollRaf=null;return;}
  boardEl.scrollLeft+=scrollDir;
  scrollRaf=requestAnimationFrame(autoScroll);
}
function setAutoScroll(clientX){
  const r=boardEl.getBoundingClientRect(),EDGE=110,SPEED=16;
  if(clientX<r.left+EDGE)scrollDir=-SPEED*(1-(clientX-r.left)/EDGE);
  else if(clientX>r.right-EDGE)scrollDir=SPEED*(1-(r.right-clientX)/EDGE);
  else scrollDir=0;
  if(scrollDir&&!scrollRaf)scrollRaf=requestAnimationFrame(autoScroll);
}
function stopAutoScroll(){scrollDir=0;}
/* greppa tom yta på brädan och dra för att panorera */
let panX=null,panStart=0;
boardEl.addEventListener('mousedown',e=>{
  if(e.button!==0||e.target.closest('.cardc'))return;
  panX=e.clientX;panStart=boardEl.scrollLeft;
});
window.addEventListener('mousemove',e=>{
  if(panX==null)return;
  boardEl.scrollLeft=panStart-(e.clientX-panX);
});
window.addEventListener('mouseup',()=>{panX=null;});
boardEl.addEventListener('dragover',e=>{
  if(dragId)setAutoScroll(e.clientX);
  const col=e.target.closest('.col');if(!col)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.col.over').forEach(x=>{if(x!==col)x.classList.remove('over');});
  col.classList.add('over');
});
document.getElementById('board').addEventListener('drop',e=>{
  const col=e.target.closest('.col');if(!col||!dragId)return;
  e.preventDefault();
  const l=leads.find(x=>x.id===dragId);
  if(l&&l.status!==col.dataset.col){l.status=col.dataset.col;l.updated=today;save(leads);}
  dragId=null;stopAutoScroll();renderAll();
});

/* ── DRAWER ── */
const drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim');
function renderCadTrack(l){
  const track=document.getElementById('cad-track');
  const done=l.cadenceDay,isNur=done==='nurture',nd=nextLbl(l);
  track.innerHTML=CAD.map(d=>{
    const isDone=isNur||(done!==''&&done!=null&&d<=+done);
    return `<span class="pill ${isDone?'done':''} ${nd==='dag '+d?'next':''}" data-day="${d}">D${d}</span>`;
  }).join('')+`<span class="pill ${isNur?'done':''} ${nd==='nurture'?'next':''}" data-day="nurture">Nurt</span>`;
  const meta=document.getElementById('cad-meta');
  if(CLOSED.includes(l.status))meta.textContent='Avslutad — ingen cadence.';
  else if(!l.nextAction)meta.textContent='Inte startad — logga första touchen.';
  else meta.innerHTML=`Nästa: <b>${nextLbl(l)}</b> · ${l.nextAction}${l.nextAction<=today?' · <span style="color:var(--danger)">förfallen</span>':''}${l.lastTouch?' · senast '+l.lastTouch:''}`;
}
function renderQuick(l){
  const q=[];
  if(l.web)q.push(`<a class="q" href="${esc(l.web)}" target="_blank" rel="noopener">Öppna sajt ↗</a>`);
  if(l.phone)q.push(`<a class="q" href="tel:${esc(l.phone.replace(/[^\d+]/g,''))}">Ring ${esc(l.phone)}</a>`);
  if(l.email)q.push(`<a class="q" href="mailto:${esc(l.email)}">Mejla</a>`);
  document.getElementById('dr-quick').innerHTML=q.join('');
}
function openDrawer(id){
  editId=id||null;
  const l=id?leads.find(x=>x.id===id):norm({});
  if(!l)return;
  document.getElementById('dr-title').textContent=id?l.name:'Nytt lead';
  const sSel=document.getElementById('f-status');
  sSel.innerHTML=STATUSES.map(s=>`<option${s===l.status?' selected':''}>${s}</option>`).join('');
  ['name','web','contact','phone','email','city','notes'].forEach(k=>document.getElementById('f-'+k).value=l[k]||'');
  document.getElementById('f-pathway').value=l.pathway||'samtal';
  document.getElementById('dr-del').style.display=id?'':'none';
  document.getElementById('cad').style.display=id?'':'none';
  if(id){renderCadTrack(l);renderQuick(l);}else{document.getElementById('dr-quick').innerHTML='';}
  drawer.classList.add('open');scrim.classList.add('open');
  setTimeout(()=>document.getElementById('f-name').focus(),80);
}
function closeDrawer(){drawer.classList.remove('open');scrim.classList.remove('open');editId=null;}
document.getElementById('dr-close').onclick=closeDrawer;
scrim.onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();document.getElementById('menu').classList.remove('open');}});

document.getElementById('dr-save').onclick=()=>{
  const name=document.getElementById('f-name').value.trim();
  if(!name)return alert('Företagsnamn krävs.');
  if(!editId&&leads.some(l=>l.name.toLowerCase()===name.toLowerCase())&&!confirm('"'+name+'" finns redan. Lägga till ändå?'))return;
  const prev=editId?(leads.find(x=>x.id===editId)||{}):{};
  const l=norm({
    id:editId||('l'+Date.now()),name,
    web:document.getElementById('f-web').value.trim(),
    contact:document.getElementById('f-contact').value.trim(),
    phone:document.getElementById('f-phone').value.trim(),
    email:document.getElementById('f-email').value.trim(),
    city:document.getElementById('f-city').value.trim(),
    status:document.getElementById('f-status').value,
    pathway:document.getElementById('f-pathway').value,
    notes:document.getElementById('f-notes').value.trim(),
    cadenceDay:prev.cadenceDay||'',nextAction:prev.nextAction||'',lastTouch:prev.lastTouch||'',
    updated:today
  });
  if(editId){const i=leads.findIndex(x=>x.id===editId);if(i>-1)leads[i]=l;}else leads.unshift(l);
  save(leads);closeDrawer();renderAll();
};
document.getElementById('dr-del').onclick=()=>{
  if(!editId||!confirm('Radera detta lead? Det går inte att ångra.'))return;
  markDeleted(editId);
  leads=leads.filter(x=>x.id!==editId);save(leads);closeDrawer();renderAll();
};
document.getElementById('touch').onclick=()=>{
  if(!editId)return;const l=leads.find(x=>x.id===editId);if(!l)return;
  logTouch(l);save(leads);
  document.getElementById('f-status').value=l.status;
  renderCadTrack(l);renderStats();renderDue();renderBoard();
};
document.getElementById('cad-track').addEventListener('click',e=>{
  const p=e.target.closest('[data-day]');if(!p||!editId)return;
  const l=leads.find(x=>x.id===editId);if(!l)return;
  const d=p.dataset.day;
  if(String(l.cadenceDay)===d){
    const i=CAD.indexOf(+d);
    setCad(l,d==='nurture'?CAD[CAD.length-1]:(i>0?CAD[i-1]:''));
  }else setCad(l,d);
  save(leads);
  document.getElementById('f-status').value=l.status;
  renderCadTrack(l);renderStats();renderDue();renderBoard();
});

  const rows=[['Namn','Webbplats','Kontakt','Telefon','E-post','Ort','Status','Väg','Nästa touch','Senaste touch','Anteckningar','Uppdaterad']];
  leads.forEach(l=>rows.push([l.name,l.web,l.contact,l.phone,l.email,l.city,l.status,l.pathway,l.nextAction,l.lastTouch,l.notes,l.updated]));
  const csv=rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
  dl('bahko-crm-'+today+'.csv','data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv));
};
document.getElementById('backup').onclick=()=>{
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('bb_'))data[k]=localStorage.getItem(k);}
  dl('bahko-crm-backup-'+today+'.json','data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(data,null,2)));
};
function dl(name,href){const a=document.createElement('a');a.href=href;a.download=name;a.click();}
document.getElementById('restore').onclick=()=>document.getElementById('restore-file').click();
document.getElementById('restore-file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      const keys=Object.keys(data).filter(k=>k.startsWith('bb_'));
      if(!keys.length)return alert('Ingen CRM-data i filen.');
      if(!confirm('Importera '+keys.length+' nycklar? Skriver över nuvarande data.'))return;
      keys.forEach(k=>localStorage.setItem(k,data[k]));
      location.reload();
    }catch{alert('Kunde inte läsa filen — är det en giltig backup?');}
  };
  r.readAsText(f);e.target.value='';
};

function renderAll(){renderStats();renderDue();renderBoard();}
renderAll();
</script>
</body>
