<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<!-- Tipsgrafik 1080×1350 (IG-porträtt) för @brommatradgardsservice.
     Query-parametrar:
       ?bg=bakgrunder/fil.jpg        bakgrundsbild (AI-genererad, UTAN text)
       &k=Kicker                     liten rubrik (default: Tips från oss)
       &t=Stora rubriken
       &b1=Punkt ett&b2=Punkt två&b3=Punkt tre   (b2/b3 valfria)
       &rut=1                        visar RUT-badgen
     Rendera:  msedge --headless --window-size=1080,1350 --screenshot=ut.png "file:///...tipsgrafik.html?bg=...&t=..." -->
<title>Tipsgrafik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:'Archivo',sans-serif;color:#F2EFE9;background:#0B0B0D;position:relative;
  display:flex;flex-direction:column;justify-content:flex-end;padding:0}
#bg{position:absolute;inset:0;background-size:cover;background-position:center}
/* scrim: alltid läsbart oavsett bakgrund */
.scrim{position:absolute;inset:0;background:
  linear-gradient(180deg, rgba(11,11,13,.32) 0%, rgba(11,11,13,.10) 32%, rgba(11,11,13,.72) 62%, rgba(11,11,13,.95) 100%)}
.rut{position:absolute;top:64px;right:64px;display:none;align-items:center;gap:12px;
  background:rgba(107,191,89,.16);border:2px solid #6BBF59;border-radius:100px;
  padding:16px 30px;font-size:24px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9FE08A;
  backdrop-filter:blur(6px)}
.content{position:relative;padding:0 84px 76px}
.kicker{display:inline-block;font-size:22px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;
  color:#9FE08A;border-left:6px solid #6BBF59;padding-left:18px;margin-bottom:28px}
h1{font-size:78px;line-height:1.06;font-weight:900;letter-spacing:-.015em;max-width:880px;margin-bottom:44px}
.rows{display:flex;flex-direction:column;gap:22px;margin-bottom:52px}
.row{display:flex;align-items:flex-start;gap:20px;font-size:33px;line-height:1.35;font-weight:500;color:rgba(242,239,233,.92)}
.row::before{content:'';width:14px;height:14px;border-radius:50%;flex-shrink:0;margin-top:15px;
  background:linear-gradient(135deg,#9FE08A,#3F8F3D)}
.row:empty{display:none}
.foot{display:flex;align-items:center;justify-content:space-between;padding-top:40px;
  border-top:1px solid rgba(242,239,233,.18)}
.foot img{height:58px;display:block}
.cta{font-size:23px;font-weight:600;color:rgba(242,239,233,.65)}
.cta b{color:#9FE08A}
</style>
</head>
<body>
  <div id="bg"></div>
  <div class="scrim"></div>
  <div class="rut" id="rut">✓ Ger rutavdrag</div>
  <div class="content">
    <span class="kicker" id="k">Tips från oss</span>
    <h1 id="t">Rubrik här</h1>
    <div class="rows">
      <div class="row" id="b1"></div>
      <div class="row" id="b2"></div>
      <div class="row" id="b3"></div>
    </div>
    <div class="foot">
      <img src="logo.svg" alt="Bromma Trädgårdsservice">
      <span class="cta">Kostnadsfritt hembesök · <b>070-766 65 14</b></span>
    </div>
  </div>
<script>
const p=new URLSearchParams(location.search);
if(p.get('bg'))document.getElementById('bg').style.backgroundImage=`url('${p.get('bg')}')`;
if(p.get('k'))document.getElementById('k').textContent=p.get('k');
if(p.get('t'))document.getElementById('t').textContent=p.get('t');
['b1','b2','b3'].forEach(id=>{const v=p.get(id);if(v)document.getElementById(id).textContent=v;});
if(p.get('rut'))document.getElementById('rut').style.display='flex';
const t=document.getElementById('t');
if(t.textContent.length>34)t.style.fontSize='64px';
if(t.textContent.length>50)t.style.fontSize='54px';
</script>
</body>
</html>
