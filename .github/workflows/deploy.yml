# OBS: bahkobyra.se + bahkobyra.cloud deployas via Vercel (vercel.json, outputDirectory: bahkobyra/).
# Denna workflow deployar endast Maykas-sajten (maykaskitchen.se) som ligger kvar på GitHub Pages.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-maykas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Maykas site
        run: |
          mkdir -p dist-maykas
          cp -r bahkobyra/cloud/maykaskitchen/. dist-maykas/
          echo "maykaskitchen.se" > dist-maykas/CNAME

      - name: Deploy to BahkoStudio/MaykaKitchen gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEMO_REPO_TOKEN }}
          external_repository: BahkoStudio/MaykaKitchen
          publish_dir: ./dist-maykas
          publish_branch: gh-pages
          force_orphan: true
